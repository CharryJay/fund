<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票组合收益对比分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1em;
        }

        .main-content {
            padding: 30px;
        }

        .time-filter {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }

        .time-filter label {
            font-weight: bold;
            color: #2c3e50;
        }

        .time-filter input[type="date"] {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .time-filter input[type="date"]:focus {
            outline: none;
            border-color: #3498db;
        }

        .portfolios-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .portfolio-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
        }

        .portfolio-card:hover {
            border-color: #3498db;
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.2);
        }

        .portfolio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .portfolio-title {
            font-size: 1.5em;
            color: #2c3e50;
            font-weight: bold;
        }

        .portfolio-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }

        .stock-list {
            margin-bottom: 20px;
        }

        .stock-item {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .stock-input {
            flex: 1;
            min-width: 120px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .weight-input {
            width: 100px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .remove-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .remove-btn:hover {
            background: #c0392b;
        }

        .add-stock-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .add-stock-btn:hover {
            background: #229954;
        }

        .total-weight {
            margin-top: 15px;
            padding: 10px;
            background: #fff;
            border-radius: 5px;
            font-size: 14px;
        }

        .total-weight.warning {
            color: #e74c3c;
            font-weight: bold;
        }

        .total-weight.success {
            color: #27ae60;
            font-weight: bold;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .compare-btn {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .compare-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(52, 152, 219, 0.4);
        }

        .compare-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .chart-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .chart-title {
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .results-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .result-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .result-card h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 2em;
            font-weight: bold;
        }

        .positive {
            color: #27ae60;
        }

        .negative {
            color: #e74c3c;
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5em;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .info-tip {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .info-tip h4 {
            color: #1976d2;
            margin-bottom: 10px;
        }

        .info-tip ul {
            margin-left: 20px;
            color: #555;
        }

        .info-tip li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 股票组合收益对比分析</h1>
            <p>自定义股票组合，对比不同持仓策略的收益表现</p>
        </div>

        <div class="main-content">
            <div class="info-tip">
                <h4>💡 使用提示</h4>
                <ul>
                    <li>输入股票代码（如：HK3033、HK0700、HK9988等）</li>
                    <li>设置每只股票的权重（总和应为100%或1）</li>
                    <li>选择时间范围进行回测</li>
                    <li>点击"开始对比"查看收益曲线</li>
                    <li>支持港股市场，代码格式：HK + 数字</li>
                    <li>📊 数据来源：Yahoo Finance（实时数据），如获取失败则使用模拟数据</li>
                </ul>
            </div>

            <div class="time-filter">
                <label>📅 开始日期：</label>
                <input type="date" id="startDate">
                <label>📅 结束日期：</label>
                <input type="date" id="endDate">
                <button onclick="setDateRange('1y')" style="padding: 10px 20px; border: none; background: #3498db; color: white; border-radius: 5px; cursor: pointer;">1年</button>
                <button onclick="setDateRange('6m')" style="padding: 10px 20px; border: none; background: #3498db; color: white; border-radius: 5px; cursor: pointer;">6个月</button>
                <button onclick="setDateRange('3m')" style="padding: 10px 20px; border: none; background: #3498db; color: white; border-radius: 5px; cursor: pointer;">3个月</button>
                <button onclick="setDateRange('1m')" style="padding: 10px 20px; border: none; background: #3498db; color: white; border-radius: 5px; cursor: pointer;">1个月</button>
            </div>

            <div class="portfolios-section">
                <!-- 组合A -->
                <div class="portfolio-card" id="portfolioA">
                    <div class="portfolio-header">
                        <div>
                            <span class="portfolio-color" style="background: #e74c3c;"></span>
                            <span class="portfolio-title">组合 A</span>
                        </div>
                    </div>
                    <div class="stock-list" id="stocksA">
                        <div class="stock-item">
                            <input type="text" class="stock-input" placeholder="股票代码 (如: HK3033)" value="HK3033">
                            <input type="number" class="weight-input" placeholder="权重" value="100" min="0" max="100" step="0.1">
                            <span style="color: #666;">%</span>
                            <button class="remove-btn" onclick="removeStock('A', this)" style="display: none;">删除</button>
                        </div>
                    </div>
                    <button class="add-stock-btn" onclick="addStock('A')">+ 添加股票</button>
                    <div class="total-weight success" id="totalWeightA">总权重: 100%</div>
                </div>

                <!-- 组合B -->
                <div class="portfolio-card" id="portfolioB">
                    <div class="portfolio-header">
                        <div>
                            <span class="portfolio-color" style="background: #3498db;"></span>
                            <span class="portfolio-title">组合 B</span>
                        </div>
                    </div>
                    <div class="stock-list" id="stocksB">
                        <div class="stock-item">
                            <input type="text" class="stock-input" placeholder="股票代码 (如: HK07552)" value="HK07552">
                            <input type="number" class="weight-input" placeholder="权重" value="10" min="0" max="100" step="0.1">
                            <span style="color: #666;">%</span>
                            <button class="remove-btn" onclick="removeStock('B', this)">删除</button>
                        </div>
                        <div class="stock-item">
                            <input type="text" class="stock-input" placeholder="股票代码 (如: HK9988)" value="HK9988">
                            <input type="number" class="weight-input" placeholder="权重" value="90" min="0" max="100" step="0.1">
                            <span style="color: #666;">%</span>
                            <button class="remove-btn" onclick="removeStock('B', this)">删除</button>
                        </div>
                    </div>
                    <button class="add-stock-btn" onclick="addStock('B')">+ 添加股票</button>
                    <div class="total-weight success" id="totalWeightB">总权重: 100%</div>
                </div>
            </div>

            <div class="action-buttons">
                <button class="compare-btn" onclick="comparePortfolios()" id="compareBtn">🚀 开始对比</button>
            </div>

            <div class="chart-container" id="chartContainer" style="display: none;">
                <h2 class="chart-title">📊 收益曲线对比</h2>
                <canvas id="comparisonChart"></canvas>
                
                <div class="results-summary" id="resultsSummary">
                    <!-- 结果将在这里显示 -->
                </div>
            </div>

            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>正在获取股票数据并计算收益...</p>
            </div>
        </div>
    </div>

    <script>
        let chart = null;

        // 初始化日期范围
        function initDateRange() {
            const today = new Date();
            const oneYearAgo = new Date(today.getFullYear() - 1, today.getMonth(), today.getDate());
            
            document.getElementById('endDate').valueAsDate = today;
            document.getElementById('startDate').valueAsDate = oneYearAgo;
        }

        // 设置日期范围
        function setDateRange(period) {
            const today = new Date();
            let startDate;
            
            switch(period) {
                case '1m':
                    startDate = new Date(today.getFullYear(), today.getMonth() - 1, today.getDate());
                    break;
                case '3m':
                    startDate = new Date(today.getFullYear(), today.getMonth() - 3, today.getDate());
                    break;
                case '6m':
                    startDate = new Date(today.getFullYear(), today.getMonth() - 6, today.getDate());
                    break;
                case '1y':
                default:
                    startDate = new Date(today.getFullYear() - 1, today.getMonth(), today.getDate());
            }
            
            document.getElementById('startDate').valueAsDate = startDate;
            document.getElementById('endDate').valueAsDate = today;
        }

        // 添加股票
        function addStock(portfolio) {
            const stockList = document.getElementById(`stocks${portfolio}`);
            const stockItem = document.createElement('div');
            stockItem.className = 'stock-item';
            stockItem.innerHTML = `
                <input type="text" class="stock-input" placeholder="股票代码 (如: HK0700)">
                <input type="number" class="weight-input" placeholder="权重" value="0" min="0" max="100" step="0.1">
                <span style="color: #666;">%</span>
                <button class="remove-btn" onclick="removeStock('${portfolio}', this)">删除</button>
            `;
            stockList.appendChild(stockItem);
            updateTotalWeight(portfolio);
        }

        // 删除股票
        function removeStock(portfolio, btn) {
            const stockItem = btn.parentElement;
            stockItem.remove();
            updateTotalWeight(portfolio);
        }

        // 更新总权重
        function updateTotalWeight(portfolio) {
            const weightInputs = document.querySelectorAll(`#stocks${portfolio} .weight-input`);
            let total = 0;
            
            weightInputs.forEach(input => {
                total += parseFloat(input.value) || 0;
            });
            
            const totalWeightDiv = document.getElementById(`totalWeight${portfolio}`);
            totalWeightDiv.textContent = `总权重: ${total.toFixed(1)}%`;
            
            if (Math.abs(total - 100) < 0.1) {
                totalWeightDiv.className = 'total-weight success';
            } else {
                totalWeightDiv.className = 'total-weight warning';
            }
        }

        // 监听权重变化
        document.addEventListener('input', function(e) {
            if (e.target.classList.contains('weight-input')) {
                const portfolio = e.target.closest('.portfolio-card').id.replace('portfolio', '');
                updateTotalWeight(portfolio);
            }
        });
        // CORS 代理服务（用于绕过浏览器 CORS 限制）
        const CORS_PROXY = 'https://api.allorigins.win/raw?url=';
        
        // Yahoo Finance API 基础 URL
        const YAHOO_FINANCE_BASE = 'https://query1.finance.yahoo.com/v8/finance/chart/';

        // 将港股代码转换为 Yahoo Finance 格式
        function convertToYahooSymbol(stockCode) {
            // 处理 HK 前缀的代码
            if (stockCode.toUpperCase().startsWith('HK')) {
                const numberPart = stockCode.substring(2);
                return `${numberPart}.HK`;
            }
            // 如果已经是正确的格式，直接返回
            if (stockCode.includes('.HK') || stockCode.includes('.SS') || stockCode.includes('.SZ')) {
                return stockCode;
            }
            // 默认添加 .HK 后缀
            return `${stockCode}.HK`;
        }

        // 从 Yahoo Finance 获取股票数据
        async function fetchStockDataFromYahoo(symbol, startDate, endDate) {
            const yahooSymbol = convertToYahooSymbol(symbol);
            const startTimestamp = Math.floor(new Date(startDate).getTime() / 1000);
            const endTimestamp = Math.floor(new Date(endDate).getTime() / 1000);
            
            const url = `${YAHOO_FINANCE_BASE}${yahooSymbol}?period1=${startTimestamp}&period2=${endTimestamp}&interval=1d&includePreClose=false&range=1d&useYield=false`;
            
            try {
                // 使用 CORS 代理
                const response = await fetch(CORS_PROXY + encodeURIComponent(url));
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.chart || !data.chart.result || data.chart.result.length === 0) {
                    console.warn(`No data found for ${symbol}`);
                    return [];
                }
                
                const result = data.chart.result[0];
                const timestamps = result.timestamp || [];
                const quotes = result.indicators.quote[0] || {};
                const closes = quotes.close || [];
                
                const stockData = [];
                for (let i = 0; i < timestamps.length; i++) {
                    if (closes[i] !== null && closes[i] !== undefined) {
                        const date = new Date(timestamps[i] * 1000).toISOString().split('T')[0];
                        stockData.push({
                            date: date,
                            price: closes[i],
                            code: symbol
                        });
                    }
                }
                
                return stockData;
            } catch (error) {
                console.error(`Error fetching data for ${symbol}:`, error);
                // 降级到模拟数据
                return generateMockData(symbol, startDate, endDate);
            }
        }

        // 生成模拟数据（作为备用方案）
        function generateMockData(stockCode, startDate, endDate) {
            const start = new Date(startDate);
            const end = new Date(endDate);
            const data = [];
            
            // 根据股票代码生成不同的基准价格
            const hash = stockCode.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            let basePrice = 50 + (hash % 100);
            const currentDate = new Date(start);
            
            // 使用确定性的随机种子
            let seed = hash;
            function pseudoRandom() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            }
            
            while (currentDate <= end) {
                // 跳过周末
                if (currentDate.getDay() !== 0 && currentDate.getDay() !== 6) {
                    // 随机波动 -3% 到 +3%
                    const change = (pseudoRandom() - 0.5) * 0.06;
                    basePrice = basePrice * (1 + change);
                    
                    data.push({
                        date: currentDate.toISOString().split('T')[0],
                        price: Math.max(basePrice, 1), // 确保价格为正
                        code: stockCode
                    });
                }
                currentDate.setDate(currentDate.getDate() + 1);
            }
            
            return data;
        }

        // 获取股票数据（主函数）- 接入真实 API
        async function fetchStockData(stockCode, startDate, endDate) {
            // 首先尝试从 Yahoo Finance 获取真实数据
            const realData = await fetchStockDataFromYahoo(stockCode, startDate, endDate);
            
            if (realData && realData.length > 0) {
                return realData;
            }
            
            // 如果真实数据获取失败，返回模拟数据
            console.log(`Using mock data for ${stockCode}`);
            return generateMockData(stockCode, startDate, endDate);
        }

        // 计算组合收益
        function calculatePortfolioReturn(stocks, stockDataMap, startDate) {
            const dates = Object.keys(stockDataMap)[0] ? 
                stockDataMap[Object.keys(stockDataMap)[0]].map(d => d.date) : [];
            
            if (dates.length === 0) return [];
            
            const portfolioValues = [];
            let initialValue = 0;
            
            // 计算初始值
            stocks.forEach(stock => {
                const stockData = stockDataMap[stock.code];
                if (stockData && stockData.length > 0) {
                    const firstPrice = stockData[0].price;
                    initialValue += firstPrice * (stock.weight / 100);
                }
            });
            
            if (initialValue === 0) return [];
            
            // 计算每个时间点的组合价值
            dates.forEach(date => {
                let portfolioValue = 0;
                
                stocks.forEach(stock => {
                    const stockData = stockDataMap[stock.code];
                    if (stockData) {
                        const dayData = stockData.find(d => d.date === date);
                        if (dayData) {
                            portfolioValue += dayData.price * (stock.weight / 100);
                        }
                    }
                });
                
                const returnRate = ((portfolioValue - initialValue) / initialValue) * 100;
                portfolioValues.push({
                    date: date,
                    value: returnRate
                });
            });
            
            return portfolioValues;
        }

        // 对比组合
        async function comparePortfolios() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            if (!startDate || !endDate) {
                alert('请选择开始和结束日期');
                return;
            }
            
            // 获取组合A的股票
            const stocksA = [];
            document.querySelectorAll('#stocksA .stock-item').forEach(item => {
                const code = item.querySelector('.stock-input').value.trim();
                const weight = parseFloat(item.querySelector('.weight-input').value) || 0;
                if (code && weight > 0) {
                    stocksA.push({ code, weight });
                }
            });
            
            // 获取组合B的股票
            const stocksB = [];
            document.querySelectorAll('#stocksB .stock-item').forEach(item => {
                const code = item.querySelector('.stock-input').value.trim();
                const weight = parseFloat(item.querySelector('.weight-input').value) || 0;
                if (code && weight > 0) {
                    stocksB.push({ code, weight });
                }
            });
            
            if (stocksA.length === 0 || stocksB.length === 0) {
                alert('请至少为每个组合添加一只股票');
                return;
            }
            
            // 显示加载动画
            document.getElementById('loading').style.display = 'block';
            document.getElementById('chartContainer').style.display = 'none';
            document.getElementById('compareBtn').disabled = true;
            
            try {
                // 获取所有股票数据
                const allStockCodes = [...new Set([
                    ...stocksA.map(s => s.code),
                    ...stocksB.map(s => s.code)
                ])];
                
                const stockDataMap = {};
                
                for (const code of allStockCodes) {
                    stockDataMap[code] = await fetchStockData(code, startDate, endDate);
                }
                
                // 计算组合收益
                const returnsA = calculatePortfolioReturn(stocksA, stockDataMap, startDate);
                const returnsB = calculatePortfolioReturn(stocksB, stockDataMap, startDate);
                
                // 绘制图表
                drawChart(returnsA, returnsB, stocksA, stocksB);
                
                // 显示结果
                showResults(returnsA, returnsB, stocksA, stocksB);
                
                document.getElementById('chartContainer').style.display = 'block';
            } catch (error) {
                console.error('Error:', error);
                alert('获取数据时出错，请稍后重试');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('compareBtn').disabled = false;
            }
        }

        // 绘制图表
        function drawChart(returnsA, returnsB, stocksA, stocksB) {
            const ctx = document.getElementById('comparisonChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }
            
            const labels = returnsA.map(r => r.date);
            const valuesA = returnsA.map(r => r.value);
            const valuesB = returnsB.map(r => r.value);
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: `组合 A (${stocksA.map(s => `${s.code}:${s.weight}%`).join(', ')})`,
                            data: valuesA,
                            borderColor: '#e74c3c',
                            backgroundColor: 'rgba(231, 76, 60, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4
                        },
                        {
                            label: `组合 B (${stocksB.map(s => `${s.code}:${s.weight}%`).join(', ')})`,
                            data: valuesB,
                            borderColor: '#3498db',
                            backgroundColor: 'rgba(52, 152, 219, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        title: {
                            display: true,
                            text: '组合收益率对比 (%)',
                            font: {
                                size: 18
                            }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toFixed(2) + '%';
                                }
                            }
                        },
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: '收益率 (%)'
                            },
                            ticks: {
                                callback: function(value) {
                                    return value + '%';
                                }
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '日期'
                            }
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
        }

        // 显示结果摘要
        function showResults(returnsA, returnsB, stocksA, stocksB) {
            const summaryDiv = document.getElementById('resultsSummary');
            
            const finalReturnA = returnsA.length > 0 ? returnsA[returnsA.length - 1].value : 0;
            const finalReturnB = returnsB.length > 0 ? returnsB[returnsB.length - 1].value : 0;
            
            const maxReturnA = Math.max(...returnsA.map(r => r.value), 0);
            const maxReturnB = Math.max(...returnsB.map(r => r.value), 0);
            
            const minReturnA = Math.min(...returnsA.map(r => r.value), 0);
            const minReturnB = Math.min(...returnsB.map(r => r.value), 0);
            
            summaryDiv.innerHTML = `
                <div class="result-card">
                    <h3>组合 A 最终收益</h3>
                    <div class="result-value ${finalReturnA >= 0 ? 'positive' : 'negative'}">
                        ${finalReturnA >= 0 ? '+' : ''}${finalReturnA.toFixed(2)}%
                    </div>
                    <p>${stocksA.map(s => `${s.code}:${s.weight}%`).join(', ')}</p>
                </div>
                <div class="result-card">
                    <h3>组合 B 最终收益</h3>
                    <div class="result-value ${finalReturnB >= 0 ? 'positive' : 'negative'}">
                        ${finalReturnB >= 0 ? '+' : ''}${finalReturnB.toFixed(2)}%
                    </div>
                    <p>${stocksB.map(s => `${s.code}:${s.weight}%`).join(', ')}</p>
                </div>
                <div class="result-card">
                    <h3>组合 A 最大回撤</h3>
                    <div class="result-value negative">
                        ${minReturnA.toFixed(2)}%
                    </div>
                    <p>期间最低点</p>
                </div>
                <div class="result-card">
                    <h3>组合 B 最大回撤</h3>
                    <div class="result-value negative">
                        ${minReturnB.toFixed(2)}%
                    </div>
                    <p>期间最低点</p>
                </div>
                <div class="result-card">
                    <h3>收益差异</h3>
                    <div class="result-value ${(finalReturnB - finalReturnA) >= 0 ? 'positive' : 'negative'}">
                        ${(finalReturnB - finalReturnA) >= 0 ? '+' : ''}${(finalReturnB - finalReturnA).toFixed(2)}%
                    </div>
                    <p>组合 B 相对于组合 A</p>
                </div>
                <div class="result-card">
                    <h3>最佳表现</h3>
                    <div class="result-value positive">
                        ${Math.max(maxReturnA, maxReturnB).toFixed(2)}%
                    </div>
                    <p>${maxReturnA > maxReturnB ? '组合 A' : '组合 B'}</p>
                </div>
            `;
        }

        // 初始化
        initDateRange();
        updateTotalWeight('A');
        updateTotalWeight('B');
    </script>
</body>
</html>
